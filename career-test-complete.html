<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/college-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complete Career Test - Find My Career</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="career-test-page test-complete-page">
    <header class="test-header">
      <div class="test-header-inner">
        <a class="test-logo" href="index.html">
          <img src="/images/college-logo.png" alt="Find My Career" />
        </a>
                        <nav class="test-nav">
<a href="career-path.html#career-test-faq">FAQs</a>
          <a href="#" class="test-login">
            Log In <i class="ri-arrow-right-up-line"></i>
          </a>
        </nav>
      </div>
    </header>

    <main class="test-step2-shell test-complete-shell">
      <section class="test-step2-left test-complete-left">
        <a class="test-back-link" href="career-test.html">
          <i class="ri-arrow-left-s-line"></i> Back
        </a>

        <div class="test-form-card test-complete-card">
          <h1>Career Test Completion Confirmation</h1>
          <p>
            Access Your Test Results with the Received Test ID, Sent to Your
            Email
          </p>

          <form class="test-form" action="career-test-step4.html">
            <label>
              Email
              <input type="email" placeholder="ex: email@gmail.com" required />
            </label>
            <label>
              Test ID
              <input type="text" placeholder="ex: l4d2q4r7h3" required />
            </label>

            <button type="submit" class="test-submit-btn">Continue</button>
          </form>
        </div>
      </section>

    </main>
    <script type="module" src="/main.js"></script>
</body>
</html>
