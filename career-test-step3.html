<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/college-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Test Step 3 - Find My Career</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="career-test-page test-step3-page">
    <header class="test-header">
      <div class="test-header-inner">
        <a class="test-logo" href="index.html">
          <img src="/images/college-logo.png" alt="Find My Career" />
          <span class="test-logo-text">
            <strong>education</strong>
            <strong>basket</strong>
          </span>
        </a>
        <nav class="test-nav">
          <a href="#">Resources</a>
          <a href="#">FAQs</a>
          <a href="#" class="test-login">
            Log In <i class="ri-arrow-right-up-line"></i>
          </a>
        </nav>
      </div>
    </header>

    <main class="test-step3-shell test-scale-shell">
      <section class="test-step3-left test-scale-left">
        <div class="test-scale-card">
          <h1>Do you like designing websites and graphics?</h1>

          <form class="test-scale-form" action="career-test-step4.html">
            <div class="test-scale-track">
              <label class="test-scale-dot">
                <input type="radio" name="scale" value="1" required />
                <span></span>
              </label>
              <label class="test-scale-dot">
                <input type="radio" name="scale" value="2" />
                <span></span>
              </label>
              <label class="test-scale-dot">
                <input type="radio" name="scale" value="3" />
                <span></span>
              </label>
              <label class="test-scale-dot">
                <input type="radio" name="scale" value="4" />
                <span></span>
              </label>
              <label class="test-scale-dot">
                <input type="radio" name="scale" value="5" />
                <span></span>
              </label>
            </div>

            <div class="test-scale-labels">
              <span>Not at all</span>
              <span>Neutral</span>
              <span>Extremely</span>
            </div>

            <button type="submit" class="test-scale-btn">Next Question</button>
          </form>
        </div>
      </section>

      <aside class="test-step3-right test-scale-right">
        <span class="test-scale-pin"></span>
        <div class="test-scale-dots">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </aside>
    </main>
  </body>
</html>
