<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/college-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Test Step 2 - Find My Career</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" crossorigin href="/assets/style-CJf0Ap4A.css">
  </head>
  <body class="career-test-page test-step2-page">
    <header class="test-header">
      <div class="test-header-inner">
        <a class="test-logo" href="index.html">
          <img src="/images/college-logo.png" alt="Find My Career" />
          <span class="test-logo-text">
            <strong>education</strong>
            <strong>basket</strong>
          </span>
        </a>
        <nav class="test-nav">
          <a href="#">Resources</a>
          <a href="#">FAQs</a>
          <a href="#" class="test-login">
            Log In <i class="ri-arrow-right-up-line"></i>
          </a>
        </nav>
      </div>
    </header>

    <main class="test-step2-shell">
      <section class="test-step2-left">
        <a class="test-back-link" href="career-test.html">
          <i class="ri-arrow-left-s-line"></i> Back
        </a>

        <div class="test-form-card">
          <h1>Tell Us About Yourself</h1>
          <p>
            Your Details Personalize Your Journey And Enhance Accuracy, Securely
            Stored And Private
          </p>

          <form class="test-form" action="career-test-step3.html">
            <label>
              Full Name
              <input type="text" placeholder="ex: Jane John" required />
            </label>
            <label>
              Email
              <input type="email" placeholder="ex: email@gmail.com" required />
            </label>
            <label>
              Phone Number
              <div class="test-input-wrap">
                <span class="test-flag">+94</span>
                <input type="tel" placeholder="+94 117 221 192" required />
              </div>
            </label>
            <label>
              Date of Birth
              <div class="test-input-wrap">
                <input type="text" placeholder="DD-MM-YYYY" required />
                <i class="ri-calendar-2-line"></i>
              </div>
            </label>

            <button type="submit" class="test-submit-btn">
              Take the test
            </button>
          </form>
        </div>
      </section>

      <aside class="test-step2-right">
        <div class="test-dot-grid">
          <span class="test-dot"></span>
          <span class="test-dot"></span>
          <span class="test-dot"></span>
          <span class="test-dot"></span>
          <span class="test-dot"></span>
          <span class="test-dot"></span>
          <span class="test-dot"></span>
          <span class="test-dot"></span>
          <span class="test-dot"></span>
          <span class="test-dot"></span>
          <span class="test-dot"></span>
          <span class="test-dot"></span>
          <span class="test-dot"></span>
          <span class="test-dot"></span>
          <span class="test-dot"></span>
          <span class="test-dot"></span>
          <span class="test-dot"></span>
          <span class="test-dot"></span>
          <span class="test-dot"></span>
          <span class="test-dot"></span>
        </div>
      </aside>
    </main>
  </body>
</html>
