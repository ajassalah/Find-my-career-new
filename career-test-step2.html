<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/college-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Test Step 2 - Find My Career</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/intl-tel-input@19.5.5/build/css/intlTelInput.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="career-test-page test-step2-page">
    <header class="test-header">
      <div class="test-header-inner">
        <a class="test-logo" href="index.html">
          <img src="/images/college-logo.png" alt="Find My Career" />
        </a>
        <nav class="test-nav">
          <a href="career-path.html#career-test-faq">FAQs</a>
          <a href="#" class="test-login">
            Log In <i class="ri-arrow-right-up-line"></i>
          </a>
        </nav>
      </div>
    </header>

    <main class="test-step2-shell">
      <section class="test-step2-left">
        <a class="test-back-link" href="career-test.html">
          <i class="ri-arrow-left-s-line"></i> Back
        </a>

        <div class="test-form-card">
          <h1>Tell Us About Yourself</h1>
          <p>
            Your Details Personalize Your Journey And Enhance Accuracy, Securely
            Stored And Private
          </p>

          <form class="test-form" action="career-test-step3.html">
            <label>
              Full Name
              <input
                id="test-full-name"
                type="text"
                placeholder="ex: Jane John"
                required
              />
            </label>
            <label>
              Email
              <input type="email" placeholder="ex: email@gmail.com" required />
            </label>
            <label>
              Phone Number
              <input
                id="test-phone"
                type="tel"
                placeholder="012 345 679"
                required
              />
            </label>
            <label>
              Date of Birth
              <div class="test-input-wrap">
                <input type="date" class="test-date-input" required />
                <button type="button" class="test-calendar-btn" aria-label="Open calendar">
                  <i class="ri-calendar-2-line"></i>
                </button>
              </div>
            </label>

            <button type="submit" class="test-submit-btn">Take the test</button>
          </form>
        </div>
      </section>
    </main>
    <script type="module" src="/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@19.5.5/build/js/intlTelInput.min.js"></script>
    <script>
      const phoneInput = document.querySelector("#test-phone");
      if (phoneInput && window.intlTelInput) {
        window.intlTelInput(phoneInput, {
          initialCountry: "lk",
          separateDialCode: true,
          utilsScript:
            "https://cdn.jsdelivr.net/npm/intl-tel-input@19.5.5/build/js/utils.js",
        });
      }

      const testForm = document.querySelector(".test-form");
      const fullNameInput = document.querySelector("#test-full-name");
      if (testForm && fullNameInput) {
        testForm.addEventListener("submit", () => {
          const trimmedName = fullNameInput.value.trim();
          if (trimmedName) {
            localStorage.setItem("careerTestName", trimmedName);
          }
        });
      }

      const dateInput = document.querySelector(".test-date-input");
      const calendarBtn = document.querySelector(".test-calendar-btn");
      if (dateInput && calendarBtn) {
        calendarBtn.addEventListener("click", () => {
          dateInput.focus();
          if (dateInput.showPicker) {
            dateInput.showPicker();
          }
        });
      }
    </script>
  </body>
</html>
